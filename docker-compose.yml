services:
  # 1. MongoDB Database Container
  mongo:
    image: mongo:latest
    container_name: fullstack-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - fullstack-net

  # 2. Node.js Express Backend API Container
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fullstack-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/dockerpra
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - fullstack-net

  # 3. React Frontend Container (Served via Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fullstack-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - fullstack-net

# Persistent Volumes
volumes:
  mongo-data:
    driver: local

# Bridge Network for inter-container communication
networks:
  fullstack-net:
    driver: bridge
